<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="60" y="55" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">OpenCRSF signal path</text>
  <text x="60" y="84" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">ExpressLRS receiver data → CRSF/UART → ESP32-C3 → 6 PWM outputs</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="145" rx="16" ry="16" width="210" height="120" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="165" y="184" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">ExpressLRS</text>
    <text x="165" y="211" text-anchor="middle" font-size="16" fill="#374151">RadioMaster</text>
    <text x="165" y="239" text-anchor="middle" font-size="14" fill="#6b7280">2.4 GHz RC link</text>

    <rect x="345" y="145" rx="16" ry="16" width="210" height="120" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="450" y="184" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">ELRS receiver</text>
    <text x="450" y="211" text-anchor="middle" font-size="16" fill="#374151">CRSF over UART</text>
    <text x="450" y="239" text-anchor="middle" font-size="14" fill="#6b7280">420000 baud</text>

    <rect x="630" y="125" rx="16" ry="16" width="240" height="160" fill="#eef2ff" stroke="#3730a3" stroke-width="2.5"/>
    <text x="750" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">ESP32-C3</text>
    <text x="750" y="195" text-anchor="middle" font-size="17" fill="#374151">CRSF parser</text>
    <text x="750" y="220" text-anchor="middle" font-size="17" fill="#374151">channel mapping</text>
    <text x="750" y="245" text-anchor="middle" font-size="17" fill="#374151">failsafe</text>
    <text x="750" y="270" text-anchor="middle" font-size="17" fill="#374151">PWM generation</text>

    <rect x="945" y="100" rx="14" ry="14" width="190" height="45" fill="#f9fafb" stroke="#9ca3af"/>
    <rect x="945" y="160" rx="14" ry="14" width="190" height="45" fill="#f9fafb" stroke="#9ca3af"/>
    <rect x="945" y="220" rx="14" ry="14" width="190" height="45" fill="#f9fafb" stroke="#9ca3af"/>
    <rect x="945" y="280" rx="14" ry="14" width="190" height="45" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="1040" y="129" text-anchor="middle" font-size="16" fill="#111827">PWM CH1–CH2</text>
    <text x="1040" y="189" text-anchor="middle" font-size="16" fill="#111827">PWM CH3–CH4</text>
    <text x="1040" y="249" text-anchor="middle" font-size="16" fill="#111827">PWM CH5</text>
    <text x="1040" y="309" text-anchor="middle" font-size="16" fill="#111827">PWM CH6</text>

    <line x1="270" y1="205" x2="345" y2="205" stroke="#111827" stroke-width="3"/>
    <polygon points="345,205 333,198 333,212" fill="#111827"/>
    <line x1="555" y1="205" x2="630" y2="205" stroke="#111827" stroke-width="3"/>
    <polygon points="630,205 618,198 618,212" fill="#111827"/>
    <line x1="870" y1="190" x2="945" y2="122" stroke="#111827" stroke-width="2.5"/>
    <polygon points="945,122 930,124 938,136" fill="#111827"/>
    <line x1="870" y1="205" x2="945" y2="182" stroke="#111827" stroke-width="2.5"/>
    <polygon points="945,182 931,177 935,190" fill="#111827"/>
    <line x1="870" y1="225" x2="945" y2="242" stroke="#111827" stroke-width="2.5"/>
    <polygon points="945,242 935,232 932,246" fill="#111827"/>
    <line x1="870" y1="242" x2="945" y2="302" stroke="#111827" stroke-width="2.5"/>
    <polygon points="945,302 937,288 929,298" fill="#111827"/>

    <text x="307" y="185" text-anchor="middle" font-size="13" fill="#6b7280">RF link</text>
    <text x="592" y="185" text-anchor="middle" font-size="13" fill="#6b7280">CRSF</text>
  </g>
</svg>
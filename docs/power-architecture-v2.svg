<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="55" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">V2 power architecture</text>
  <text x="55" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">Shared servo bus with a separately protected electronics branch</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="55" y="135" width="170" height="250" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
    <text x="140" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">6 servo connectors</text>
    <text x="140" y="202" text-anchor="middle" font-size="14" fill="#374151">CH1 +5V</text>
    <text x="140" y="232" text-anchor="middle" font-size="14" fill="#374151">CH2 +5V</text>
    <text x="140" y="262" text-anchor="middle" font-size="14" fill="#374151">CH3 +5V</text>
    <text x="140" y="292" text-anchor="middle" font-size="14" fill="#374151">CH4 +5V</text>
    <text x="140" y="322" text-anchor="middle" font-size="14" fill="#374151">CH5 +5V</text>
    <text x="140" y="352" text-anchor="middle" font-size="14" fill="#374151">CH6 +5V</text>

    <rect x="315" y="165" width="210" height="190" rx="16" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="420" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">VBUS</text>
    <text x="420" y="236" text-anchor="middle" font-size="14" fill="#374151">F1 · 2.5A PTC</text>
    <text x="420" y="262" text-anchor="middle" font-size="14" fill="#374151">D1 · P6KE6.8CA TVS</text>
    <text x="420" y="288" text-anchor="middle" font-size="14" fill="#374151">1000 µF + 100 µF</text>
    <text x="420" y="314" text-anchor="middle" font-size="14" fill="#374151">+ 100 nF</text>

    <rect x="620" y="120" width="235" height="95" rx="16" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
    <text x="737" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Q1</text>
    <text x="737" y="184" text-anchor="middle" font-size="14" fill="#374151">AO3401A P-channel MOSFET</text>

    <rect x="620" y="255" width="235" height="130" rx="16" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
    <text x="737" y="291" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Protected branch</text>
    <text x="737" y="318" text-anchor="middle" font-size="14" fill="#374151">F2 · PTC</text>
    <text x="737" y="344" text-anchor="middle" font-size="14" fill="#374151">D2 · Schottky</text>
    <text x="737" y="370" text-anchor="middle" font-size="14" fill="#374151">SYS_5V</text>

    <rect x="950" y="160" width="190" height="85" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
    <text x="1045" y="195" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Servos / ESC</text>
    <text x="1045" y="222" text-anchor="middle" font-size="14" fill="#374151">shared VBUS</text>

    <rect x="950" y="300" width="190" height="85" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
    <text x="1045" y="335" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">ESP32 + ELRS</text>
    <text x="1045" y="362" text-anchor="middle" font-size="14" fill="#374151">protected SYS_5V</text>

    <line x1="225" y1="205" x2="315" y2="205" stroke="#111827" stroke-width="3"/>
    <polygon points="315,205 303,198 303,212" fill="#111827"/>
    <line x1="525" y1="205" x2="620" y2="167" stroke="#111827" stroke-width="3"/>
    <polygon points="620,167 607,158 612,173" fill="#111827"/>
    <line x1="525" y1="285" x2="950" y2="202" stroke="#111827" stroke-width="3"/>
    <polygon points="950,202 936,196 940,210" fill="#111827"/>
    <line x1="737" y1="215" x2="737" y2="255" stroke="#111827" stroke-width="3"/>
    <polygon points="737,255 730,243 744,243" fill="#111827"/>
    <line x1="855" y1="320" x2="950" y2="342" stroke="#111827" stroke-width="3"/>
    <polygon points="950,342 937,334 935,348" fill="#111827"/>

    <text x="278" y="190" text-anchor="middle" font-size="13" fill="#6b7280">+5V bus</text>
    <text x="830" y="191" text-anchor="middle" font-size="13" fill="#6b7280">servo power</text>
    <text x="885" y="334" text-anchor="middle" font-size="13" fill="#6b7280">SYS_5V</text>

    <text x="55" y="450" font-size="14" fill="#374151">Design goal: keep the high-current servo bus and the sensitive electronics rail from sharing the same unprotected path.</text>
    <text x="55" y="475" font-size="14" fill="#6b7280">This diagram reflects the V2 architecture documented in the repository. It is not a PCB layout.</text>
  </g>
</svg>